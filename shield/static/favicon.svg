<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Apple-Style Rounded Squircle Backdrop — Graphite Green -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0C1110" stroke="rgba(163, 230, 53, 0.4)" stroke-width="1.5" />
  
  <!-- Subtle Matrix Circuit Lines -->
  <path d="M 16 32 L 24 32 L 32 20 L 40 44 L 48 32" stroke="rgba(163, 230, 53, 0.45)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Glowing Emerald & Lime Security Shield -->
  <path d="M 32 16 L 44 21 V 33 C 44 41 38 47 32 50 C 26 47 20 41 20 33 V 21 Z" fill="url(#shieldGrad)" filter="url(#shieldGlow)" />
  <path d="M 28 32 L 31 35 L 36 28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
