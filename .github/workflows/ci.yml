name: AgentShield CI/CD & Security Regression Suite

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-evaluate:
    name: Security Tests & Red-Team Regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Code Quality & Linting
        run: |
          ruff check shield/ tests/

      - name: Run Pytest Security Suite
        run: |
          pytest -v --tb=short

      - name: Enforce Red-Team Benchmark Recall & False Positive Gate
        run: |
          python -m shield.evaluator.red_team --fail-under 95.0 --max-fpr 2.0
